name: FAO AGRIS ODS file-size probe
on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe_ods_size.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - run: Rscript -e 'install.packages("httr2")'
      - name: Inspect HTTP metadata and limited range response
        run: Rscript scripts/probe_ods_size.R
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agris-ods-probe
          path: outputs/probe_results.rds
          if-no-files-found: ignore
