name: Sample AGRIS provider download sizes
on:
  push:
    branches: [main]
    paths:
      - 'scripts/sample_provider_sizes.R'
      - '.github/workflows/sample_provider_sizes.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - run: Rscript -e 'install.packages(c("xml2","curl"))'
      - run: Rscript scripts/sample_provider_sizes.R
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agris-provider-size-sample
          path: outputs/*.csv
          if-no-files-found: warn
