name: Probe AGRIS ranged GET size headers
on:
  push:
    branches: [main]
    paths:
      - 'scripts/probe_range_get.R'
      - '.github/workflows/probe_range_get.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - run: Rscript -e 'install.packages("curl")'
      - run: Rscript scripts/probe_range_get.R
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agris-range-probe
          path: outputs/agris_range_probe.csv
          if-no-files-found: warn
