name: Enumerate AGRIS ODS provider XML files
on:
  push:
    branches: [main]
    paths:
      - 'scripts/enumerate_providers.R'
      - '.github/workflows/enumerate_providers.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install dependencies
        run: Rscript -e 'install.packages(c("xml2", "curl"))'
      - name: Inventory all provider file sizes without downloading provider data
        run: Rscript scripts/enumerate_providers.R
      - name: Upload CSV inventory
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agris-provider-inventory
          path: outputs/*.csv
          if-no-files-found: warn
          retention-days: 30
